[tasks.xml-envelope]
summary = "Wrap all four MCP tool returns in an XML envelope for the calling LLM to parse."
prompt = """
Orient:
- Read `src/firepass_mcp/server.py` end-to-end. The current return path
  is `_format_activity_footer` + concatenation in `agent_loop` and the
  three MCP tool wrappers (`firepass_worker`, `firepass_researcher`,
  `firepass_reviewer`).
- Read `src/firepass_mcp/tools.py` to understand `tool_names()` and
  `format_tool_activity` — those produce the activity list.
- Read `tests/test_server.py` to see what currently asserts about output
  format (currently the activity footer is plain text).

Context — what changes:
- Current return string is a Kimi-generated result body followed by:
    `\\n\\n--- ACTIVITY LOG ---\\nIterations: N  |  Tool calls: M\\n<bullets>\\n--- END ---`
- New return string wraps the same content in XML so the calling LLM
  can address each section:
    `<firepass_worker status=\"...\" iterations=\"N\" tool_calls=\"M\">\\n<result>...body...</result>\\n<activity>\\n<call>[edit] /path</call>\\n...\\n</activity>\\n</firepass_worker>`
- The root tag name is the MCP tool name (worker / researcher /
  reviewer). For the trio (added in a later task), the root will be
  `<firepass_trio>` with nested sub-envelopes per round.
- Status values:
    * `\"completed\"` — model called `done()`
    * `\"max_iterations\"` — loop exhausted without `done()`
    * `\"api_error\"` — Fireworks API or streaming error
    * `\"context_overflow\"` — `enforce_context_budget` raised
    * `\"tool_call_parse_error\"` — `parse_tool_calls` returned errors
- The `<result>` body is the same Kimi-generated content as today.
  Do NOT alter what Kimi writes; only the wrapper changes.
- `<activity>` carries the existing activity bullets, one per `<call>`
  tag. Iteration count and tool-call count move to attributes on the
  root tag (no duplicate plaintext line inside).

Important architectural constraint:
- DO NOT change the signature of `agent_loop`. dgov settlement has a
  signature_drift gate; adding parameters to that function will be
  rejected. Instead, `agent_loop` always emits envelopes with the
  default root tag `<firepass_run>`. The three MCP wrappers
  post-process the returned string to rename the outer tag.

Edit:
1. In `src/firepass_mcp/server.py`, add three small module-private
   helpers in this order, replacing `_format_activity_footer`:
   - `_xml_escape(s)` — escape `&`, `<`, `>` (in that order). Three
     replaces, no html lib.
   - `_xml_envelope(status, iterations, activity, body)` — return the
     wrapped string with the hardcoded root tag `firepass_run`. Shape:
       `<firepass_run status=\"X\" iterations=\"N\" tool_calls=\"M\">\\n<result>...</result>\\n<activity>\\n<call>...</call>\\n...\\n</activity>\\n</firepass_run>`
     `activity` is a list[str]; map each through `_xml_escape` and
     wrap in `<call>...</call>`. `body` goes through `_xml_escape`
     before being placed inside `<result>...</result>`. Iteration
     count and tool-call count are attribute values on the root.
   - `_retag_envelope(xml, new_tag)` — rename the outermost
     `firepass_run` open/close tags to `new_tag`. Pure string slicing:
     find the literal `<firepass_run` and `</firepass_run>` substrings
     and replace both (the open form preserves attributes after the
     tag name, so only the substring `firepass_run` is swapped, not
     the full open tag). Single replacement of each, not global.
2. Replace `_format_activity_footer` with `_xml_envelope` at every
   return point in `agent_loop`. Keep `agent_loop`'s signature
   exactly as it was on main (no new params). Cover six return paths:
   - context overflow (top-of-iteration `enforce_context_budget`
     raised): `status=\"context_overflow\"`
   - API/streaming error from `_stream_response`: `status=\"api_error\"`
   - `parse_tool_calls` returned errors: `status=\"tool_call_parse_error\"`
   - model returned content with no tool_calls (plain completion):
     `status=\"completed\"`
   - `done()` tool call: `status=\"completed\"`
   - iteration limit exhausted: `status=\"max_iterations\"`
3. In each of the three MCP wrappers (`firepass_worker`,
   `firepass_researcher`, `firepass_reviewer`), capture the
   `agent_loop` return value into a variable, then return
   `_retag_envelope(value, \"firepass_worker\")` (or `_firepass_researcher`
   / `_firepass_reviewer`). Do not modify the wrappers'
   signatures or decorators.

Tests — add to `tests/test_server.py`:
- `test_xml_envelope_wraps_done_result` — call `firepass_worker`
  end-to-end with a mocked `_stream_response` that emits a `done()`;
  assert the returned string starts with
  `<firepass_worker status=\"completed\"` and contains
  `<result>` and ends with `</firepass_worker>`.
- `test_xml_envelope_escapes_result_body` — feed a Kimi-result with `<`
  and `&` characters; assert they are escaped in the `<result>` block.
- `test_xml_envelope_status_max_iterations` — exhaust iterations,
  assert `status=\"max_iterations\"`.
- `test_xml_envelope_status_api_error` — make `_stream_response` raise
  `RuntimeError`, assert `status=\"api_error\"`.
- `test_xml_envelope_status_context_overflow` — pass an oversize
  system prompt, assert `status=\"context_overflow\"`.
- `test_xml_envelope_status_tool_call_parse_error` — emit a malformed
  tool_call shape, assert `status=\"tool_call_parse_error\"`.
- Update any existing test that pattern-matches the old
  `--- ACTIVITY LOG ---` footer to match the new XML form.

Out of scope:
- Do NOT add `firepass_trio` here. Separate task.
- Do NOT touch `README.md` — that lives in a later task.
- Do NOT introduce new dependencies.

Verify:
- `uv run pytest -q tests/test_server.py`
- `uv run ruff check src tests`
- `uv run ruff format --check src tests`
- `uv run ty check src`
"""
commit_message = "Wrap MCP tool returns in XML envelope"
role = "worker"
files.edit = [
  "src/firepass_mcp/server.py",
  "tests/test_server.py",
]
files.read = [
  "src/firepass_mcp/tools.py",
  "src/firepass_mcp/messages.py",
]
test_cmd = "uv run pytest -q tests/test_server.py"
verify = "standard"

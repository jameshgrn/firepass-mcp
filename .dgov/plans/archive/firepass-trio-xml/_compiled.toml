Orient:
- Read `src/firepass_mcp/server.py` after the xml-envelope task lands.
  The three MCP wrappers (`firepass_worker`, `firepass_researcher`,
  `firepass_reviewer`) and `agent_loop` are now wrapped in
  `_xml_envelope`. Reuse that helper here.
- Read `src/firepass_mcp/tools.py` for `TOOL_DEFS`, `READONLY_TOOL_DEFS`,
  `READONLY_BLOCKED_TOOLS`, `normalize_cwd`, `clamp_max_iterations`,
  `MAX_ITERATIONS_LIMIT`.
- Read `tests/test_server.py` for existing test patterns (monkeypatched
  `agent_loop`, recorded args). Mirror those for the new tests.

Spec — what `firepass_trio` does:
- New MCP tool registered on the same `FastMCP` server as the other
  three. Decorator: `@mcp.tool()`.
- Signature:
    `async def firepass_trio(prompt: str, cwd: str, context: str = "",
        max_iterations: int = 60, max_review_rounds: int = 2) -> str:`
- Flow:
    1. Run researcher once with the user prompt → research findings.
    2. Run worker with the user prompt + researcher findings as
       context → implementation result.
    3. Run reviewer with the user prompt + worker result as context →
       review verdict.
    4. If the reviewer's `done()` body contains the literal string
       `NEEDS-FIXES` and `rounds_used < max_review_rounds`, run worker
       again with the reviewer findings appended to context, then
       reviewer again. Repeat until APPROVE or rounds exhausted.
    5. Wrap the whole run in `<firepass_trio status="...">` with
       nested `<research>`, then a `<rounds>` block containing one
       `<round n="1">` per worker+reviewer pair, each carrying a
       nested `<implementation>` and `<review>`.
- `status` values for the trio root:
    * `"approved"` — final reviewer verdict was APPROVE
    * `"needs_fixes"` — rounds exhausted with reviewer still saying
      NEEDS-FIXES
    * `"research_failed"` — researcher returned non-completed status
    * `"implementation_failed"` — worker returned non-completed status
    * `"review_failed"` — reviewer returned non-completed status
- Each nested `<research>`, `<implementation>`, `<review>` envelope is
  exactly the string already produced by the corresponding sub-call
  (worker/researcher/reviewer), with its outer tag renamed. Reuse the
  existing `_retag_envelope(xml, new_tag)` helper added in the
  xml-envelope task — pass `"research"`, `"implementation"`,
  or `"review"`. Do NOT re-escape the bodies; the sub-calls already
  escape them.
- Both `max_iterations` and `max_review_rounds` are clamped:
    * `max_iterations`: existing `clamp_max_iterations`.
    * `max_review_rounds`: new `clamp_max_review_rounds` in tools.py
      with ceiling `MAX_REVIEW_ROUNDS_LIMIT = 5`. Same semantics
      (raises on ≤ 0, clamps to ceiling).

Edit:
1. `src/firepass_mcp/tools.py`:
   - Add `MAX_REVIEW_ROUNDS_LIMIT = 5` next to `MAX_ITERATIONS_LIMIT`.
   - Add `clamp_max_review_rounds(value: int) -> int` mirroring
     `clamp_max_iterations`.
2. `src/firepass_mcp/server.py`:
   - Add `firepass_trio` as a new `@mcp.tool()`.
   - Internal `_run_trio_chain` async helper does the orchestration so
     `firepass_trio` itself is a thin wrapper that clamps inputs and
     delegates.
   - The trio assembles its own envelope WITHOUT `_xml_envelope`
     (whose `<result>` shape doesn't fit). Build the outer string
     directly:
       `<firepass_trio status="..." rounds="N">\\n<research ...>...</research>\\n<rounds>\\n<round n="1">\\n<implementation ...>...</implementation>\\n<review ...>...</review>\\n</round>\\n...\\n</rounds>\\n</firepass_trio>`
     The `<research>`, `<implementation>`, and `<review>` blocks come
     from `_retag_envelope` applied to the worker/researcher/reviewer
     return values. Attribute values on the trio root are integers and
     do not need escaping.
   - DO NOT modify `_xml_envelope` itself. DO NOT modify any of the
     three existing wrappers' signatures or decorators.

Tests — add to `tests/test_server.py`:
- `test_firepass_trio_approve_first_round` — monkeypatch the three sub
  MCP tools to return canned approve envelopes; assert trio status is
  `approved`, exactly one `<round>` exists, researcher ran once.
- `test_firepass_trio_loops_on_needs_fixes_then_approves` — first
  reviewer call returns NEEDS-FIXES, second returns APPROVE; assert
  status `approved`, two `<round>`s, worker called twice with
  reviewer findings present in the second worker's `context` arg.
- `test_firepass_trio_exhausts_rounds` — every reviewer call returns
  NEEDS-FIXES; assert status `needs_fixes`, exactly
  `max_review_rounds` rounds present.
- `test_firepass_trio_clamps_max_review_rounds` — call with
  `max_review_rounds=99`; assert internal max_review_rounds is
  `MAX_REVIEW_ROUNDS_LIMIT`.
- `test_firepass_trio_rejects_zero_review_rounds` — call with
  `max_review_rounds=0` raises ValueError (matches existing iteration
  clamp behavior).
- `test_firepass_trio_research_failure_short_circuits` — researcher
  returns non-completed envelope; assert trio status is
  `research_failed` and worker was NEVER called.
- `test_clamp_max_review_rounds_helper` — direct unit test for the
  new clamp function (valid / negative / zero / huge).

Out of scope:
- Do NOT touch README.md (separate task).
- Do NOT change the existing three MCP tools' surface area; the trio

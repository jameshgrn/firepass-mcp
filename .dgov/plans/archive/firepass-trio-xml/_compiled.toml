prompt = """
[SOP: Code Review Standards]
Summary: What to look for and how to structure findings when reviewing code changes.
Applies To: review, reviewer, diff, audit, inspect, finding
Priority: MUST

When:
- reviewing any code change as a reviewer role
- evaluating a diff for semantic correctness

Do:
- reason backward from the implementation, not from the spec or task prompt
- flag logic errors, no-ops, silently wrong behavior, and missing edge cases
- check if the code is simple enough to debug (if writing it was hard, debugging it will be harder)
- flag behavior that would surprise the next reader of this code
- flag changes to public interfaces that break implicit contracts downstream
- note coupling chains that reach through multiple objects to get data
- structure findings by severity: blocking issues first, then suggestions

Do Not:
- flag style preferences (naming, formatting, comment quality)
- suggest architectural rewrites beyond the scope of the diff
- flag pre-existing issues that the diff did not introduce
- demand missing tests (that is a separate concern)

Verify:
- read surrounding code for context before flagging something as wrong
- confirm a flagged pattern is actually new in this diff, not pre-existing

Escalate:
- if the change reveals systemic issues beyond the diff scope
- if the diff touches a public API in a way that could break unknown consumers

[SOP: State Modeling Review]
Summary: Flag state bloat, sentinel values, grab-bag models, and mutation ambiguity in reviewed code.
Applies To: state, model, dataclass, pydantic, types, review, typed, sentinel, optional, frozen, getattr, enum
Priority: MUST

When:
- reviewing changes to data models, state types, or lifecycle code
- reviewing code that adds boolean flags, optional fields, or status strings

Do:
- flag sentinel values (empty string, zero, "none") where None would express absence
- flag optional-field grab-bags where a discriminated union would make wrong states impossible
- flag functions that mutate their input AND return it (pick one: mutate and return None, or clone and return new)
- flag if-chains where every branch returns the same shape (convert to a data table)
- flag dead type variants that are never constructed
- flag stored state that could be derived from existing data or events

Do Not:
- demand refactoring beyond the task scope
- flag working patterns just because they are not ideal if the diff did not introduce them
- flag genuine state machines as "stored state" (a checkout step IS the state, not a cached conclusion)

Verify:
- check whether flagged patterns are new in this diff or pre-existing
- confirm the suggested alternative actually fits the domain before recommending it

Escalate:
- if state model issues are systemic (multiple models affected across the codebase)
- if fixing the model would change persistence semantics or public interfaces

Orient:
- The dependency diff is auto-generated from the upstream tasks. Bound
  the review to that diff plus the files those tasks claim.
- Acceptance gates already passed: pytest, ruff, ruff format, ty all
  green per the verify recipe.

Edit:
- Reviewer only. No file edits.

Review focus (in priority order):
1. **Envelope shape correctness** — is the XML well-formed under all
   six status branches (completed / max_iterations / api_error /
   context_overflow / tool_call_parse_error / done)? Are attribute
   values escaped? Is the `<activity>` block ordered chronologically?
2. **Trio loop-back semantics** — does the worker actually receive
   the reviewer's findings as context on the second pass, or just a
   re-issued original prompt? Verify by reading
   `_run_trio_chain` and the matching test.
3. **`_rewrap_envelope` correctness** — string-slicing-based tag
   rename. Does it survive multi-line content, nested tags inside the
   body, attribute values containing `>` (should be escaped), and the
   absence of attributes? If brittle, propose a fix; do not apply.
4. **Status taxonomy** — are the seven statuses (six single-tool +
   trio's `approved`/`needs_fixes`/`research_failed`/etc.) used
   consistently? Any silent fallthrough that hides errors as
   `completed`?
5. **Test coverage** — is `max_review_rounds=1` behavior tested? Is the
   case where researcher returns a non-completed envelope tested? Is
   the loop-back-then-approve path tested?
6. **API surface drift** — did the three existing MCP tools gain
   parameters they shouldn't have? `firepass_worker`'s signature must
   stay (`prompt, cwd, context="", max_iterations=60`).
7. **README** — does the documented envelope shape match what the
   code emits? Any drift?

Output structure for the `done()` body:
- `VERIFIED`: claims confirmed (file:line each)
- `BLOCKING`: bugs that would justify a revert (file:line + repro)
- `SUGGESTIONS`: non-blocking improvements
- `VERDICT`: APPROVE / NEEDS-FIXES

Under 700 words.
"""
commit_message = ""
role = "reviewer"
depends_on = ["tasks/xml-envelope.xml-envelope", "tasks/trio.trio", "tasks/docs.docs"]
